version: '3.8'

services:

  app:
    image: my-registry.com/my-app:v1.0.0

    build:
      context: .
      dockerfile: Dockerfile.prod

    restart: always

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL}

      REDIS_HOST:  redis_server
      REDIS_PORT: 6379

    depends_on:
      - redis

    command: >
      sh -c "
      npx prisma migrate deploy &&
      node dist/main.js
      "

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    image: redis:7-alpine

    restart: always

    volumes:
      - redis_data:/data


volumes:
  redis_data:
